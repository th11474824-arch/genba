<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>現場管理</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{--g:#2e6b4f;--g2:#e8f2ec;--line:#e2e6e4;--txt:#1f2a25;--sub:#6b7a72;--red:#d64545;--bg:#f6f8f7}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--txt);background:var(--bg);font-size:15px}
  header{background:var(--g);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
  header b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0} header small{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
  nav{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:46px;z-index:4}
  nav button{flex:1 0 auto;border:0;background:none;padding:12px 14px;font-size:14px;color:var(--sub);border-bottom:3px solid transparent}
  nav button.on{color:var(--g);border-color:var(--g);font-weight:700}
  main{max-width:1100px;margin:0 auto;padding:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{font-size:16px;margin:0 0 12px} h3{font-size:14px;margin:16px 0 8px;color:var(--sub)}
  label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:10px;border:1px solid #cfd8d3;border-radius:8px;font-size:16px;background:#fff}
  textarea{min-height:90px}
  .row{display:flex;gap:8px}.row>*{flex:1}
  .btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;background:var(--g);color:#fff;cursor:pointer}
  .btn.big{width:100%;padding:18px;font-size:18px;margin-top:8px}
  .btn.out{background:#fff;color:var(--g);border:1.5px solid var(--g)}
  .btn.red{background:var(--red)} .btn.sm{padding:7px 12px;font-size:13px}
  .btn:disabled{opacity:.45}
  .muted{color:var(--sub);font-size:13px}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--g2);color:var(--g);font-weight:700}
  .pill.tmp{background:#fff4e0;color:#a86400}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--sub);font-weight:600;font-size:12px} td.n,th.n{text-align:right}
  .scroll{overflow-x:auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .stat{background:var(--g2);border-radius:10px;padding:12px}.stat b{display:block;font-size:clamp(16px,1.7vw,22px);color:var(--g);white-space:nowrap}
  .clock{font-size:42px;font-weight:700;text-align:center;letter-spacing:2px}
  /* カレンダー */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .cal div.h{text-align:center;font-size:12px;padding:4px;color:var(--sub);background:#fafbfa}
  .cal .d{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;font-size:12px;cursor:pointer;background:#fff}
  .cal div.h,.cal .d{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .cal .d.other{background:#fafbfa;color:#b5beb9}.cal .d.today .num{background:var(--g);color:#fff;border-radius:99px;padding:0 6px}
  .ev{color:#fff;border-radius:4px;padding:1px 4px;margin-top:2px;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .ev.tmp{opacity:.6;border:1px dashed #fff}
  .sun{color:var(--red)}.sat{color:#2f6fd6}
  /* 週ごとの帯表示(連日の予定をつなげる) */
  .calw{border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .calw .wh{display:grid;grid-template-columns:repeat(7,1fr)}
  .calw .wh div{text-align:center;font-size:12px;padding:4px;color:var(--sub);background:#fafbfa;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .wk{position:relative;min-height:100px;border-bottom:1px solid var(--line)}
  .wk .bg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr)}
  .wk .bg .d{border-right:1px solid var(--line);padding:3px 4px;font-size:12px;cursor:pointer;background:#fff}
  .wk .bg .d.other{background:#fafbfa;color:#b5beb9}
  .wk .bg .d.today .num{background:var(--g);color:#fff;border-radius:99px;padding:0 6px}
  .wk .lay{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:20px;row-gap:3px;padding:24px 0 8px;pointer-events:none}
  .bar{pointer-events:auto;color:#fff;font-size:11.5px;line-height:16px;border-radius:5px;padding:2px 6px;margin:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-weight:600}
  .bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
  .bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
  .bar.tmp{opacity:.65;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px)}
  .more{pointer-events:auto;font-size:11px;color:var(--sub);padding-left:6px;cursor:pointer;line-height:20px}
  /* モーダル */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
  @media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:16px}}
  .chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{display:flex;align-items:center;gap:4px;margin:0;padding:6px 10px;border:1px solid #cfd8d3;border-radius:99px;color:var(--txt);font-size:14px}
  .chips input{width:auto}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30;max-width:90%}
  .list-item{padding:10px 0;border-bottom:1px solid var(--line)}
  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-right:4px}
  /* お金・原価 */
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .seg button{border:1.5px solid var(--g);background:#fff;color:var(--g);border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px}
  .seg button.on{background:var(--g);color:#fff}
  .neg{color:var(--red);font-weight:700} .pos{color:var(--g);font-weight:700}
  .pill.red{background:#fde8e8;color:var(--red)} .pill.blue{background:#e6effc;color:#2f6fd6} .pill.gray{background:#eef0ef;color:var(--sub)}
  .seg button .c{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:99px;background:rgba(0,0,0,.08);font-size:12px}
  .items td{padding:3px 2px} .items input{padding:7px;font-size:14px}
  .modal .box.wide{max-width:860px}
  tr.click{cursor:pointer} tr.click:hover{background:var(--g2)}
  /* 出勤簿 */
  .rost{border-collapse:collapse;font-size:11px;min-width:100%}
  .rost th,.rost td{border:1px solid #d5dcd8;padding:0;text-align:center;white-space:nowrap}
  .rost th{background:#f4f7f5;color:var(--txt);font-weight:700;padding:3px 0;min-width:52px;font-size:12px}
  .rost th.sat,.rost td.sat{background:#eef3fc} .rost th.sun,.rost td.sun{background:#fdeeee}
  .rost th.sat{color:#2f6fd6} .rost th.sun{color:var(--red)} .rost th.tday{outline:2px solid var(--g);outline-offset:-2px}
  .rost td{height:38px;width:52px;max-width:52px;vertical-align:middle;position:relative}
  .rost .nm{position:sticky;left:0;background:#fff;z-index:1;min-width:84px;max-width:84px;padding:0 6px;text-align:left;font-weight:700;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
  .rost .tot{font-weight:700;min-width:40px;background:#f4f7f5}
  .rost .cw{height:38px;display:flex;flex-direction:column}
  .rost .rc{flex:1;min-height:0;color:#fff;font-weight:700;font-size:10.5px;line-height:1.15;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:normal;word-break:break-all;padding:0 2px;text-shadow:0 0 2px rgba(0,0,0,.35)}
  .rost .rc span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rost .rc.half span{-webkit-line-clamp:1;font-size:9.5px}
  .rost .rc.half+.rc.half{border-top:1px solid rgba(255,255,255,.7)}
  .rost .rc small{font-size:9px;margin-left:1px;opacity:.95}
  .rost .off{color:var(--red);font-size:11px}
  .rost tr.sum td{font-weight:700;height:26px;background:#f4f7f5}
  #print .rost{font-size:8.5px} #print .rost td{height:28px;width:auto;max-width:none} #print .rost .cw{height:28px} #print .rost th{min-width:0}
  /* 印刷用(見積書・請求書) */
  #print{display:none;position:fixed;inset:0;background:#fff;z-index:40;overflow:auto}
  #print .bar{position:sticky;top:0;background:#f0f0f0;padding:10px;display:flex;gap:8px;justify-content:center}
  .paper{width:190mm;margin:10mm auto;color:#000;font-size:11pt;line-height:1.5}
  .paper h1{text-align:center;letter-spacing:12px;font-size:22pt;margin:0 0 8mm;border-bottom:3px double #000;padding-bottom:2mm}
  .paper .top{display:flex;justify-content:space-between;gap:10mm}
  .paper .to{font-size:15pt;border-bottom:1px solid #000;padding-bottom:1mm;min-width:85mm}
  .paper .big{font-size:16pt;font-weight:700;border:2px solid #000;padding:2mm 4mm;display:inline-block;margin:5mm 0}
  .paper table{border-collapse:collapse;width:100%;margin-top:4mm}
  .paper th,.paper td{border:1px solid #000;padding:1.5mm 2mm;white-space:normal;font-size:10pt}
  .paper th{background:#eee;color:#000;text-align:center}
  .paper .sum td{font-weight:700}
  .paper .from{text-align:right;font-size:10pt}
  @media print{
    html,body{background:#fff!important}
    body>*:not(#print){display:none!important}
    #print{display:block!important;position:static}
    #print .bar{display:none}
    .paper{margin:0 auto}
    @page{size:A4;margin:12mm}
  }
  .linkbtn{border:0;background:none;color:var(--red);font-size:12px;padding:4px 0 0;cursor:pointer;text-decoration:underline}
  tr.cogrp td{background:var(--g2);font-weight:700;color:var(--g);padding:6px 10px}
  .samebox{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#fff7e6;border:2px solid #f59e0b;border-radius:10px;padding:12px;margin:0 0 10px}
  .samebox .btn{flex:0 0 auto;background:#d97706}
</style>
</head>
<body>
<header><b id="appName">現場管理</b><span style="display:flex;gap:8px;align-items:center"><small id="who">読み込み中…</small><select id="langSel" aria-label="Language" style="width:auto;padding:4px 6px;font-size:13px;border-radius:6px"></select></span></header>
<nav id="tabs"></nav>
<main id="view"><div class="card">読み込み中…</div></main>
<div id="toast"></div>
<div id="print"></div>

<script>
// 起動の見守り:エラーや長時間の読み込みを画面に表示する(古いスマホでも動く書き方)
window.__started = false;
function __showBoot(msg) {
  var v = document.getElementById('view');
  if (v) v.innerHTML = '<div class="card"><h2>起動できませんでした</h2><p>' + msg + '</p><p class="muted">LINEの場合は画面を閉じて開き直してください。直らない場合はこの画面を管理者に送ってください。</p></div>';
}
window.addEventListener('error', function (e) {
  if (!window.__started) __showBoot('エラー:' + String(e.message || e.error || '不明').replace(/</g, '&lt;') + '<br>(' + navigator.userAgent.replace(/</g, '&lt;') + ')');
});
setTimeout(function () {
  if (!window.__started) __showBoot('読み込みに30秒以上かかっています。電波の良い場所で開き直してください。<br>(' + navigator.userAgent.replace(/</g, '&lt;') + ')');
}, 30000);
</script>

const APIQ = []; let apiTimer = null;
function api(action, params = {}) {
  const key = action + '|' + JSON.stringify(params);
  if (S.pre && S.pre[key]) { const p = S.pre[key]; delete S.pre[key]; return p; } // 起動時に先読みした分
  return new Promise((resolve, reject) => {
    APIQ.push({ action, params, resolve, reject });
    if (!apiTimer) apiTimer = setTimeout(apiFlush, 0);
  });
}
async function apiPost(body) {
  const ctrl = window.AbortController ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctrl) ctrl.abort(); }, 40000);
  let res;
  try {
    res = await fetch(CONFIG.API_URL, {
      signal: ctrl ? ctrl.signal : undefined,
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // GASのCORS対策(プリフライトを起こさない)
      body: JSON.stringify(Object.assign(body, { idToken: liff.getIDToken() })),

function apiAuthFail(err) {
  if (String(err).indexOf('AUTH') === 0) { liff.logout(); liff.login({ redirectUri: location.href }); return true; }
  return false;
}
async function apiFlush() {
  const items = APIQ.splice(0); apiTimer = null;
  if (!items.length) return;
  try {
    if (items.length === 1) {
      const it = items[0], j = await apiPost({ action: it.action, params: it.params });
      if (j.ok) return it.resolve(j.data);
      if (apiAuthFail(j.error)) return it.reject(new Error('再ログインします'));
      return it.reject(new Error(j.error));

    const j = await apiPost({ batch: items.map(it => ({ action: it.action, params: it.params })) });

    if (S.me.role === 'disabled') return renderMessage(t('disabledTitle'), t('disabledBody'));

  } catch (e) {
    renderMessage(t('bootFail'), esc(tErr(e.message)) + '<br>CONFIGのLIFF_ID / API_URL を確認してください。');
  }
})();

// 言語を画面に反映(ヘッダーと言語選択)
function applyLang(l) {
  L = LANGS.indexOf(l) >= 0 ? l : 'ja';
  try { localStorage.setItem('lang', L); } catch (e) {}
  document.documentElement.lang = L;
  $('#appName').textContent = t('appName');
  $('#who').textContent = !S.me ? t('loading') : S.me.registered ? `${S.me.name}(${t('role_' + S.me.role)})` : t('unregistered');
  $('#langSel').innerHTML = LANGS.map(k => `<option value="${k}" ${k === L ? 'selected' : ''}>${LANG_NAMES[k]}</option>`).join('');
}
document.addEventListener('change', e => {
  if (e.target.id !== 'langSel') return;
  const l = e.target.value;
  applyLang(l);
  if (S.me) { api('setLang', { lang: l }).then(() => toast(t('langChanged'))).catch(() => {}); S.me.lang = l; }
  if ($('#tabs').innerHTML) buildTabs(S.tab); else if (S.me && !S.me.registered) renderRegister();
  else if (S.me && S.me.role === 'pending') renderMessage(t('pendingTitle'), t('pendingBody'));
});

// ---------- 予定(月カレンダー) ----------
async function viewCal() {
  const [y, m] = S.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1), start = new Date(y, m - 1, 1 - first.getDay());
  const days = [...Array(42)].map((_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
  const evs = await run(() => api('schedules', { from: ymd(days[0]), to: ymd(days[41]) })) || [];
  const todayS = ymd(new Date());
  // 連日の予定を週ごとの「帯」にして、空いている段に詰めて並べる
  const day0 = Date.parse(ymd(days[0]) + 'T00:00:00');
  const idx = ds => Math.round((Date.parse(ds + 'T00:00:00') - day0) / 864e5);
  const items = evs.map(e => ({ e, s: idx(e.start.slice(0, 10)), en: idx(e.end.slice(0, 10)) }))
    .sort((a, b) => a.s - b.s || (b.en - b.s) - (a.en - a.s));
  const MAXL = 4; // 1週に表示する段数(超えた分は「+n」)
  const weeks = [0, 1, 2, 3, 4, 5].map(w => {
    const w0 = w * 7, w6 = w0 + 6, lanes = [], hidden = [0, 0, 0, 0, 0, 0, 0];
    let bars = '';
    items.forEach(({ e, s, en }) => {
      if (en < w0 || s > w6) return;
      const a = Math.max(s, w0) - w0, b = Math.min(en, w6) - w0;
      let l = 0;
      while ((lanes[l] = lanes[l] || [0, 0, 0, 0, 0, 0, 0]).slice(a, b + 1).some(Boolean)) l++;
      for (let i = a; i <= b; i++) lanes[l][i] = 1;
      if (l >= MAXL) { for (let i = a; i <= b; i++) hidden[i]++; return; }
      bars += `<div class="bar ${s < w0 ? 'cl' : ''} ${en > w6 ? 'cr' : ''} ${e.status === '仮' ? 'tmp' : ''}" data-id="${esc(e.id)}"
        style="grid-column:${a + 1}/span ${b - a + 1};grid-row:${l + 1};background:${esc(e.color)}" title="${esc(e.siteName + ' ' + e.title)}">${e.status === '仮' ? '仮 ' : ''}${esc(e.siteName)} ${esc(e.title)}</div>`;
    });
    hidden.forEach((n, i) => { if (n) bars += `<div class="more" data-d="${ymd(days[w0 + i])}" style="grid-column:${i + 1};grid-row:${MAXL + 1}">${t('moreN', { n: n })}</div>`; });
    const bg = days.slice(w0, w0 + 7).map(d => {
      const ds = ymd(d);
      return `<div class="d ${d.getMonth() !== m - 1 ? 'other' : ''} ${ds === todayS ? 'today' : ''}" data-d="${ds}"><span class="num ${d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : ''}">${d.getDate()}</span></div>`;
    }).join('');
    return `<div class="wk"><div class="bg">${bg}</div><div class="lay">${bars}</div></div>`;
  }).join('');
  $('#view').innerHTML = `<div class="card">
    <div class="calhead">
      <div><button class="btn out sm" id="prev">‹</button> <b>${L === 'ja' ? y + '年' + m + '月' : m + '/' + y}</b> <button class="btn out sm" id="next">›</button> <button class="btn out sm" id="now">${t('thisMonth')}</button></div>
      ${S.me.can.edit ? '<button class="btn sm" id="add">+ スケジュール作成</button>' : ''}
    </div>
    <div class="calw"><div class="wh">${t('weekdays').split(',').map((w, i) => `<div class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('')}</div>${weeks}</div>
    <p class="muted">${t('calNote')}</p></div>`;
  $('#prev').onclick = () => { S.calMonth = ym(new Date(y, m - 2, 1)); viewCal(); };
  $('#next').onclick = () => { S.calMonth = ym(new Date(y, m, 1)); viewCal(); };
  $('#now').onclick = () => { S.calMonth = ym(new Date()); viewCal(); };
  if ($('#add')) $('#add').onclick = () => scheduleForm({});
  document.querySelector('.calw').onclick = e => {
    const ev = e.target.closest('.bar'), day = e.target.closest('.d') || e.target.closest('.more');
    if (ev) return scheduleDetail(evs.find(x => x.id === ev.dataset.id));
    if (day) {
      const ds = day.dataset.d, list = evs.filter(x => x.start.slice(0, 10) <= ds && x.end.slice(0, 10) >= ds);
      modal(`<h2>${t('daySched', { d: ds })}</h2>${list.length ? list.map(evLine).join('') : `<p class="muted">${t('noSched')}</p>`}
        <div class="row" style="margin-top:12px">${S.me.can.edit ? `<button class="btn" id="dadd">この日に追加</button>` : ''}<button class="btn out" onclick="closeModal()">${t('close')}</button></div>`);
      if ($('#dadd')) $('#dadd').onclick = () => scheduleForm({ start: ds + 'T08:30', end: ds + 'T17:00' });
    }
  };
}

    ${list.map(r => `<tr>${canEd ? `<td><button class="btn out sm" data-re="${esc(r.id)}">編集</button></td>` : ''}<td>${esc(r.date)}</td><td>${esc(r.name)}${r.submittedBy ? `<br><span class="muted" style="font-size:11px">${esc(t('proxyBy', { n: r.submittedBy }))}</span>` : ''}${r.editedBy ? `<br><span style="font-size:11px;color:#b45309">修正:${esc(r.editedBy)} ${esc((r.editedAt || '').slice(5))}</span>` : ''}</td><td><span class="pill ${r.workType === '加工' ? 'blue' : ''}">${esc(t('wt_' + (r.workType || '現場')))}</span></td><td>${esc(r.siteName)}</td><td>${esc(r.start)}-${esc(r.end)}</td><td>${r.otHours ? t('otNormal') + ' ' + esc(r.otHours) + 'h' : ''}${r.otHours && r.nightHours ? '<br>' : ''}${r.nightHours ? t('otNight') + ' ' + esc(r.nightHours) + 'h' : ''}</td><td style="text-align:center">${esc(r.bento || '')}</td><td style="white-space:normal;min-width:180px">${esc(r.content)}</td><td class="n">${r.expenseAmount ? esc(t('ex_' + r.expenseType)) + ' ' + yen(r.expenseAmount) : ''}</td></tr>`).join('') || `<tr><td colspan="${canEd ? 10 : 9}" class="muted">${t('none')}</td></tr>`}

  document.querySelectorAll('[data-bt]').forEach(b => b.onclick = () => document.querySelectorAll('[data-bt]').forEach(x => x.classList.toggle('on', x === b)));
  $('#r_m').onchange = e => { S.repMonth = e.target.value; viewReport(); };
  if (canEd) {
    $('#rf_u').onchange = e => { RF.user = e.target.value; viewReport(); };
    $('#rf_s').onchange = e => { RF.site = e.target.value; viewReport(); };
    $('#rf_t').onchange = e => { RF.type = e.target.value; viewReport(); };
    document.querySelectorAll('[data-re]').forEach(b => b.onclick = () => reportEdit(all.find(r => r.id === b.dataset.re)));
  }
  // 代理提出:選んだ現場の「今日の予定」の担当者を自動でチェック
  const preset = () => {
    if (!$('#r_workers')) return;
    const ids = []; today.schedules.filter(s => s.siteId === $('#r_site').value).forEach(s => (s.assignees || []).forEach(id => ids.push(id)));
    document.querySelectorAll('#r_workers input').forEach(c => { c.checked = ids.indexOf(c.value) >= 0; });
  };
  if ($('#r_workers')) {
    $('#r_site').onchange = preset; preset();
    $('#r_all').onclick = () => document.querySelectorAll('#r_workers input').forEach(c => { c.checked = true; });
    $('#r_none').onclick = () => document.querySelectorAll('#r_workers input').forEach(c => { c.checked = false; });
  }
  $('#r_save').onclick = () => run(async () => {
    const workerIds = [...document.querySelectorAll('#r_workers input:checked')].map(c => c.value);
    const r = await api('submitReport', { date: $('#r_date').value, siteId: $('#r_site').value, start: $('#r_s').value, end: $('#r_e').value, content: $('#r_c').value, expenseType: $('#r_xt').value, expenseAmount: $('#r_xa').value,
      workerIds, includeSelf: $('#r_self') ? $('#r_self').checked : true, workType: document.querySelector('[data-wt].on').dataset.wt, otHours: $('#r_ot').value, nightHours: $('#r_nt').value, bento: document.querySelector('[data-bt].on').dataset.bt });
    toast(t('submitted', { n: r.count, t: t('wt_' + document.querySelector('[data-wt].on').dataset.wt) }) + (r.skipped.length ? t('skipped', { s: r.skipped.join(', ') }) : ''));
    viewReport();
  });
}

// 日報の修正(管理者・事務)
function reportEdit(r) {

  const members = S.members.some(u => u.userId === r.userId) ? S.members : [{ userId: r.userId, name: r.name }].concat(S.members);
  const XT = ['駐車場代', '高速代', 'ガソリン代', '材料費', 'その他'];
  modal(`<h2>日報を修正</h2>
    <p class="muted" style="margin-top:0">提出:${esc(r.createdAt || '')}${r.submittedBy ? '(' + esc(r.submittedBy) + 'が代理提出)' : ''}${r.editedBy ? ` / 最終修正:${esc(r.editedBy)} ${esc(r.editedAt)}` : ''}</p>
    <div class="row"><div><label>日付</label><input type="date" id="e_date" value="${esc(r.date)}"></div>
      <div><label>作業員</label><select id="e_user">${members.map(u => `<option value="${esc(u.userId)}" ${u.userId === r.userId ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select></div></div>
    <div class="row"><div><label>区分</label><select id="e_type"><option ${r.workType !== '加工' ? 'selected' : ''}>現場</option><option ${r.workType === '加工' ? 'selected' : ''}>加工</option></select></div>
      <div><label>案件</label><select id="e_site">${siteOptions(r.siteId, true)}</select></div></div>
    <div class="row"><div><label>入場</label><input type="time" id="e_s" value="${esc(r.start)}"></div><div><label>退場</label><input type="time" id="e_e" value="${esc(r.end)}"></div></div>
    <div class="row"><div><label>通常残業</label><select id="e_ot">${hopt(r.otHours)}</select></div><div><label>深夜残業</label><select id="e_nt">${hopt(r.nightHours)}</select></div>
      <div><label>弁当</label><select id="e_bt"><option value="✕" ${r.bento !== '○' ? 'selected' : ''}>✕ なし</option><option value="○" ${r.bento === '○' ? 'selected' : ''}>○ あり</option></select></div></div>
    <label>作業内容</label><textarea id="e_c">${esc(r.content)}</textarea>
    <div class="row"><div><label>経費</label><select id="e_xt"><option value="">なし</option>${XT.map(x => `<option ${x === r.expenseType ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div><label>金額(円)</label><input type="number" id="e_xa" value="${esc(r.expenseAmount || '')}" inputmode="numeric"></div></div>
    <p class="muted">修正した内容は、給料計算・出勤簿・集計・原価にすぐ反映されます。</p>
    <div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn" id="e_save">保存</button><button class="btn out" onclick="closeModal()">キャンセル</button><button class="btn" id="e_del" style="background:var(--red);flex:0 0 auto">削除</button></div>`, true);

  $('#e_save').onclick = () => run(async () => {
    const xt = $('#e_xt').value, xa = $('#e_xa').value;

      <p class="muted">最終更新 ${esc(a.updatedAt)}(30秒ごとに自動更新)。人工・労働時間は日報(入退場時間−休憩)から計算しています。</p>

      ${pend.length ? `<div class="card" style="border:2px solid #f0b429"><h2>前払い申請 承認待ち(${pend.length}件)</h2>

function advMemo(list) {
  const total = list.reduce((s, a) => s + a.amount, 0);

function rosterModel(r) {
  const F = S.rosterF || (S.rosterF = { client: '', site: '', user: '', off: true, co: '' });
  const coU = {}; r.users.forEach(u => { coU[u.userId] = u.company || ''; });
  const coOk = uid => !F.co || (F.co === '__none' ? !coU[uid] : coU[uid] === F.co);
  const sm = r.sites, match = e => coOk(e.uid) && (!F.site || e.siteId === F.site) && (!F.client || (sm[e.siteId] || {}).client === F.client);
  const E = r.entries.filter(match), cell = {};
  E.forEach(e => { (cell[e.uid + '|' + e.date] = cell[e.uid + '|' + e.date] || []).push(e); });
  let users = r.users.filter(u => (!F.user || u.userId === F.user) && coOk(u.userId));
  if (F.site || F.client) users = users.filter(u => E.some(e => e.uid === u.userId));
  const [y, m] = r.month.split('-').map(Number);
  const days = Array.from({ length: r.days }, (_, i) => { const d = new Date(y, m - 1, i + 1); return { ds: ymd(d), n: i + 1, w: d.getDay() }; });
  return { F, E, cell, users, days, filtered: !!(F.site || F.client) };
}

    <div class="row" style="flex-wrap:wrap">
      <div><label>元請</label><select id="rf_client"><option value="">すべての元請</option>${clients.map(c => `<option ${c === F.client ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>

      <div><label>所属会社</label><select id="rf_co"><option value="">すべての会社</option>${[...new Set(r.users.map(u => u.company).filter(Boolean))].sort().map(c => `<option ${c === F.co ? 'selected' : ''}>${esc(c)}</option>`).join('')}<option value="__none" ${F.co === '__none' ? 'selected' : ''}>(未設定)</option></select></div>
      <div><label>作業員</label><select id="rf_user"><option value="">全員</option>${r.users.filter(u => coOk(u.userId)).map(u => `<option value="${esc(u.userId)}" ${u.userId === F.user ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select></div>
    </div>

    <div class="chips" style="margin-top:10px">${used.map(id => `<span class="pill" style="background:${esc((sm[id] || {}).color || '#999')};color:#fff">${esc((sm[id] || {}).name || '')}</span>`).join('') || '<span class="muted">この条件の出勤はありません</span>'}</div>

  <div class="card" style="padding:0"><div class="scroll rost-wrap" id="rost">${rosterTable(r, users, days, cellHtml, dayCount, cell, W)}</div></div>
  <p class="muted">色は元請ごとの色です(「管理」タブの「元請と色」で変更)。「加工」は日報で作業区分を加工にした日。1日に2つの現場がある日は色を分けて表示します。60秒ごとに自動更新。</p>`;

        days.filter(d => cell[u.userId + '|' + d.ds]).length]) };
    csv('roster');
  };
  $('#rprint').onclick = () => {
    $('#print').innerHTML = `<style>@page{size:A4 landscape;margin:8mm}</style><div class="bar"><button class="btn" onclick="window.print()">印刷 / PDF保存</button><button class="btn out" onclick="document.getElementById('print').style.display='none'">閉じる</button></div>
      <div style="padding:6mm"><h2 style="margin:0 0 4mm">出勤簿 ${r.month.replace('-', '年')}月 ${F.co ? '/ ' + esc(F.co === '__none' ? '所属会社 未設定' : F.co) : ''} ${F.client ? '/ ' + esc(F.client) : ''} ${F.site ? '/ ' + esc(sm[F.site].name) : ''}</h2>${rosterTable(r, users, days, cellHtml, dayCount, cell, W)}</div>`;

  };
}

  const cls = d => (d.w === 0 ? 'sun' : d.w === 6 ? 'sat' : '') + (d.ds === r.today ? ' tday' : '');

const TBL = {};
function table(title, key, head, rows) {
  TBL[key] = { title, head, rows };
  return `<div class="card"><div class="calhead"><h2 style="margin:0">${title}</h2><button class="btn out sm" data-csv="${key}">CSV</button></div>
    <div class="scroll"><table><tr>${head.map((h, i) => `<th class="${i ? 'n' : ''}">${h}</th>`).join('')}</tr>
    ${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i && typeof c === 'number' ? 'n' : ''}">${c && c.html ? c.html : typeof c === 'number' && c >= 1000 ? c.toLocaleString() : esc(c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${head.length}" class="muted">データがありません</td></tr>`}
    </table></div></div>`;
}
function csv(key) {
  const t = TBL[key], body = [t.head, ...t.rows].map(r => r.map(c => `"${String(c && c.html ? c.text : c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + body], { type: 'text/csv' }));
  a.download = `${t.title}_${S.aggMonth || ym(new Date())}.csv`; a.click();
}

      rows: rows.map(r => [r.name, r.client, r.contractType, r.estStatus, r.billStatus, r.unbilled, r.unpaid, r.manDays, r.sales, r.basis, r.labor, r.expense, ...C.map(c => r.cats[c]), r.cost, r.gross, nz(r.grossRate, ''), r.budget || '', nz(r.budgetRate, ''), r.billed, r.paid]) };

// 見積書・請求書の作成/編集
function docForm(type, d) {
  const isE = type === 'estimates', L = isE ? '見積' : '請求', ST = isE ? EST_ST : INV_ST;
  const plus = n => { const x = new Date(); x.setDate(x.getDate() + n); return ymd(x); };
  const eom = () => { const x = new Date(); return ymd(new Date(x.getFullYear(), x.getMonth() + 2, 0)); };
  const items = d.items && d.items.length ? d.items : [{ name: '', qty: 1, unit: '式', price: '' }];
  modal(`<h2>${d.id ? `${L}書を編集(${esc(d.no)})` : `${L}書を作成`}</h2>
    <div class="row"><div><label>案件 *</label><select id="d_site"><option value="">選択してください</option>${siteOptions(d.siteId, true)}</select></div>
      <div><label>状態</label><select id="d_st">${ST.map(s => `<option ${s === (d.status || ST[0]) ? 'selected' : ''}>${s}</option>`).join('')}</select></div></div>
    <p class="muted">宛名は案件の「元請」(未入力なら案件名)になります。</p>
    <label>件名 *</label><input id="d_title" value="${esc(d.title || '')}" placeholder="例:●●ビル 2F内装解体工事">
    <div class="row"><div><label>${isE ? '発行日' : '請求日'}</label><input type="date" id="d_date" value="${esc(d.issueDate || ymd(new Date()))}"></div>
      <div><label>${isE ? '有効期限' : '支払期限'}</label><input type="date" id="d_lim" value="${esc(isE ? (d.validUntil || plus(Number(S.settings['見積の有効期間(日)']) || 30)) : (d.dueDate || eom()))}"></div>
      <div><label>税率(%)</label><input type="number" id="d_tax" value="${esc(d.taxRate || S.settings['消費税率(%)'] || 10)}"></div></div>
    ${isE ? '' : `<label>入金日(「入金済」のとき。空欄なら今日)</label><input type="date" id="d_paid" value="${esc(d.paidDate || '')}">`}
    <h3>明細</h3><div class="scroll"><table class="items"><tr><th>品名・工事内容</th><th style="width:70px">数量</th><th style="width:60px">単位</th><th style="width:110px">単価(税抜)</th><th class="n" style="width:100px">金額</th><th></th></tr>
      <tbody id="d_items"></tbody></table></div>
    <button class="btn out sm" id="d_add">+ 行を追加</button>
    <div id="d_sum" style="text-align:right;margin-top:8px"></div>
    <label>備考</label><textarea id="d_note">${esc(d.note || '')}</textarea>
    <div class="row" style="margin-top:14px"><button class="btn" id="d_save">保存</button>${d.id ? '<button class="btn red" id="d_del">削除</button>' : ''}<button class="btn out" onclick="closeModal()">閉じる</button></div>`, true);
  const tb = $('#d_items');
  const rowHtml = it => `<tr><td><input class="i_n" value="${esc(it.name || '')}" style="min-width:180px"></td><td><input class="i_q" type="number" step="any" value="${esc(nz(it.qty, 1))}"></td>
    <td><input class="i_u" value="${esc(it.unit || '')}"></td><td><input class="i_p" type="number" step="any" value="${esc(nz(it.price, ''))}"></td><td class="n i_a"></td><td><button class="btn out sm i_x">×</button></td></tr>`;
  tb.innerHTML = items.map(rowHtml).join('');
  const val = (tr, c) => tr.querySelector(c).value;
  const read = () => [...tb.querySelectorAll('tr')].map(tr => ({ name: val(tr, '.i_n'), qty: val(tr, '.i_q'), unit: val(tr, '.i_u'), price: val(tr, '.i_p') }));
  const recalc = () => {
    let sub = 0;
    tb.querySelectorAll('tr').forEach(tr => { const a = Math.floor((Number(val(tr, '.i_q')) || 0) * (Number(val(tr, '.i_p')) || 0)); sub += a; tr.querySelector('.i_a').textContent = num(a); });
    const tax = Math.floor(sub * (Number($('#d_tax').value) || 0) / 100);
    $('#d_sum').innerHTML = `小計 ${yen(sub)} / 消費税 ${yen(tax)} / <b style="font-size:17px">合計 ${yen(sub + tax)}</b>`;
  };
  tb.oninput = recalc; $('#d_tax').oninput = recalc;
  tb.onclick = e => { if (e.target.classList.contains('i_x')) { e.target.closest('tr').remove(); recalc(); } };
  $('#d_add').onclick = () => { tb.insertAdjacentHTML('beforeend', rowHtml({ qty: 1, unit: '', price: '' })); recalc(); };
  recalc();
  $('#d_save').onclick = () => run(async () => {
    const p = { type, id: d.id, siteId: $('#d_site').value, status: $('#d_st').value, title: $('#d_title').value, issueDate: $('#d_date').value, taxRate: $('#d_tax').value, items: read(), note: $('#d_note').value };
    if (isE) p.validUntil = $('#d_lim').value; else { p.dueDate = $('#d_lim').value; p.paidDate = $('#d_paid').value; }
    const saved = await api('saveDoc', p); closeModal(); toast(`${saved.no} を保存しました`); viewMoney();
  });
  if ($('#d_del')) $('#d_del').onclick = () => { if (confirm('この書類を削除しますか?')) run(async () => { await api('deleteDoc', { type, id: d.id }); closeModal(); toast('削除しました'); viewMoney(); }); };
}

// 印刷(ブラウザの印刷 → 「PDFに保存」でPDFにもできる)
function printDoc(type, d) {
  if (type === 'invoices') return printInvoice(d);
  const isE = type === 'estimates', c = S.settings || {}, R = 'style="text-align:right"';
  const rows = d.items.map(i => `<tr><td>${esc(i.name)}</td><td ${R}>${esc(i.qty)}</td><td style="text-align:center">${esc(i.unit)}</td><td ${R}>${num(i.price)}</td><td ${R}>${num(i.amount)}</td></tr>`).join('');
  const blank = '<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>'.repeat(Math.max(0, 10 - d.items.length));
  $('#print').innerHTML = `<div class="bar"><button class="btn" onclick="window.print()">印刷 / PDF保存</button><button class="btn out" onclick="document.getElementById('print').style.display='none'">閉じる</button></div>
    <div class="paper"><h1>${isE ? '御見積書' : '請求書'}</h1>
    <div class="top"><div><div class="to">${esc(d.client || d.siteName)} 御中</div>
      <p>件名:${esc(d.title)}<br>${isE ? '下記の通りお見積り申し上げます。' : '下記の通りご請求申し上げます。'}</p>
      <div class="big">${isE ? '御見積金額' : 'ご請求金額'} ${yen(d.total)}(税込)</div></div>
      <div class="from">No. ${esc(d.no)}<br>${isE ? '発行日' : '請求日'}:${esc(d.issueDate)}<br><br><b style="font-size:12pt">${esc(c['会社名'])}</b><br>${esc(c['住所'])}<br>TEL ${esc(c['電話番号'])}<br>登録番号:${esc(c['登録番号(インボイス)'])}</div></div>
    <table><tr><th>品名・工事内容</th><th style="width:16mm">数量</th><th style="width:14mm">単位</th><th style="width:26mm">単価</th><th style="width:30mm">金額</th></tr>${rows}${blank}
      <tr class="sum"><td colspan="4" ${R}>小計</td><td ${R}>${num(d.subtotal)}</td></tr>
      <tr class="sum"><td colspan="4" ${R}>消費税(${esc(d.taxRate)}%対象 ${num(d.subtotal)}円)</td><td ${R}>${num(d.tax)}</td></tr>
      <tr class="sum"><td colspan="4" ${R}>合計(税込)</td><td ${R}>${num(d.total)}</td></tr></table>
    <p>${isE ? `有効期限:${esc(d.validUntil || '')}` : `お支払期限:${esc(d.dueDate || '')}<br>お振込先:${esc(c['振込先'])}`}</p>
    ${d.note ? `<p>備考:<br>${esc(d.note).replace(/\n/g, '<br>')}</p>` : ''}</div>`;
  $('#print').style.display = 'block';
}

// 請求書(会社の書式:タイトル・御中・ご請求金額・工事名称の明細・小計/消費税/合計金額・振込先)

    .inv .amt{margin-top:18mm;border-bottom:1px solid #000;display:flex;align-items:flex-end;padding:0 2mm 1mm;font-size:14pt}
    .inv .amt b{margin-left:auto;font-size:17pt;font-weight:500} .inv .amt small{font-size:9pt;margin-left:2mm}
    .inv .co{width:66mm;position:relative;font-size:9.5pt;line-height:1.55;padding-top:1mm}

    .inv table{width:100%;border-collapse:collapse;margin-top:5mm;border:1.6px solid #000}
    .inv th,.inv td{border:1px solid #000;height:6.1mm;padding:0 1.5mm;font-size:9.5pt}
    .inv th{font-weight:400;font-size:9pt;border-bottom:1.6px solid #000;text-align:center;color:#000;background:#fff;white-space:nowrap}

  <div class="inv">

// 角印の登録(請求書の会社名の横に印刷)
function sealForm() {
  modal(`<h2>角印の画像を登録</h2>
    <p class="muted">請求書の会社名の右側に印刷されます。背景が透明か白の画像(PNG・JPEG)を選んでください。画像はスプレッドシートに保存され、外部には公開されません。</p>
    ${S.seal ? `<p>現在の角印:<br><img src="${S.seal}" style="width:90px;height:90px;object-fit:contain;border:1px solid #ddd;border-radius:8px"></p>` : '<p class="muted">まだ登録されていません。</p>'}
    <input type="file" id="sealFile" accept="image/png,image/jpeg">
    <div class="row" style="margin-top:14px"><button class="btn" id="sealSave">登録する</button>${S.seal ? '<button class="btn red" id="sealDel">削除</button>' : ''}<button class="btn out" onclick="closeModal()">閉じる</button></div>`);
  $('#sealSave').onclick = () => run(async () => {
    const f = $('#sealFile').files[0]; if (!f) throw new Error('画像を選んでください');
    const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = URL.createObjectURL(f); });
    const cv = document.createElement('canvas'), sz = 240, k = Math.min(sz / img.width, sz / img.height, 1);
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    let data = cv.toDataURL('image/png');
    if (data.length > 300000) { const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; const x = c2.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(cv, 0, 0); data = c2.toDataURL('image/jpeg', 0.9); }
    await api('saveSeal', { data }); S.seal = data; closeModal(); toast('角印を登録しました');
  });
  if ($('#sealDel')) $('#sealDel').onclick = () => { if (confirm('角印を削除しますか?')) run(async () => { await api('saveSeal', { data: '' }); S.seal = ''; closeModal(); toast('削除しました'); }); };
}

// 原価入力(材料費・外注費など)
async function costInput() {
  const month = S.costMonth || ym(new Date());
  const list = await run(() => api('costs', { month })) || [];
  $('#mview').innerHTML = `<div class="card"><h2>原価の入力(材料費・外注費など)</h2>
    <div class="row"><div><label>日付</label><input type="date" id="c_date" value="${ymd(new Date())}"></div>
      <div><label>費目</label><select id="c_cat">${CATS.map(c => `<option>${c}</option>`).join('')}</select></div></div>
    <label>案件 *</label><select id="c_site"><option value="">選択してください</option>${siteOptions(S.costSite, true)}</select>
    <div class="row"><div><label>支払先</label><input id="c_vendor" placeholder="例:○○建材"></div><div><label>金額(円・税抜) *</label><input type="number" id="c_amt" inputmode="numeric"></div></div>
    <label>内容</label><input id="c_content" placeholder="例:石膏ボード 50枚">
    <label>備考</label><input id="c_memo">
    <button class="btn big" id="c_save">登録する</button>
    <p class="muted">職人が日報を出すと、その日の労務費と日報の経費(駐車場代など)は自動で原価に入るので、ここでは入力しません。</p></div>
    <div class="card"><div class="calhead"><h2 style="margin:0">登録済みの原価</h2><input type="month" id="c_m" value="${month}" style="width:auto"></div>
    <div class="scroll"><table><tr><th>日付</th><th>案件</th><th>費目</th><th>支払先</th><th>内容</th><th class="n">金額</th><th></th></tr>
    ${list.map(c => `<tr><td>${esc(c.date)}</td><td>${esc(c.siteName)}</td><td>${esc(c.category)}</td><td>${esc(c.vendor)}</td><td>${esc(c.content)}</td><td class="n">${num(c.amount)}</td>
      <td><button class="btn out sm" data-cd="${esc(c.id)}">削除</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">この月の登録はありません</td></tr>'}
    </table></div><p class="muted">この月の合計:${yen(list.reduce((s, c) => s + Number(c.amount || 0), 0))}</p></div>`;
  $('#c_m').onchange = e => { S.costMonth = e.target.value; costInput(); };
  $('#c_save').onclick = () => run(async () => {
    await api('saveCost', { date: $('#c_date').value, category: $('#c_cat').value, siteId: $('#c_site').value, vendor: $('#c_vendor').value, amount: $('#c_amt').value, content: $('#c_content').value, memo: $('#c_memo').value });
    S.costSite = $('#c_site').value; toast('原価を登録しました'); costInput();
  });
  document.querySelectorAll('[data-cd]').forEach(b => b.onclick = () => { if (confirm('この原価を削除しますか?')) run(async () => { await api('deleteCost', { id: b.dataset.cd }); toast('削除しました'); costInput(); }); });
}

// ---------- モーダル ----------
function modal(html, wide) { closeModal(); const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal'; m.innerHTML = `<div class="box ${wide ? 'wide' : ''}">${html}</div>`; m.onclick = e => { if (e.target === m) closeModal(); }; document.body.appendChild(m); }
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
</script>
